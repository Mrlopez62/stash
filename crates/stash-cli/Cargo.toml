[package]
name = "stash-cli"
description = "The stash command-line secrets manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
rpassword = "7.5.4"
secrecy = "0.10.3"
stash-core = { path = "../stash-core" }
zeroize = "1.9.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "stash"
path = "src/main.rs"
