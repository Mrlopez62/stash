[package]
name = "stash-core"
description = "Encrypted vault format and operations for stash"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hmac = "0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
