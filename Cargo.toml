[workspace]
resolver = "3"
members = ["crates/stash-core", "crates/stash-cli", "crates/stash-ffi"]

[workspace.package]
version = "0.19.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Mrlopez62/stash"
rust-version = "1.88"

# Argon2 is unbearably slow unoptimized; keep debug builds and tests snappy.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
