name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow you're trying to do and where stash gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The command, flag, or behavior you have in mind.
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Does this change who or what can access secrets? (Optional, but very helpful.)
