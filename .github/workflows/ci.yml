name: CI

# Private repos pay for Actions minutes, and macOS minutes count 10x. So:
# - pull requests run everything (that's where dev is checked before main);
# - pushes to main (merges, already checked in their PR) run Linux only;
# - pushes to dev run nothing on their own: the open PR's run covers them;
# - docs-only changes run nothing;
# - a newer push cancels the older run for the same branch.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Test the browser extension
        run: node --test browser/test/fill.test.mjs browser/test/background.test.mjs
      - name: Build Touch ID helper
        if: runner.os == 'macOS'
        run: swift build -c release --package-path swift/stash-touchid
      - name: Build the Mac app
        if: runner.os == 'macOS'
        run: swift build -c release --package-path macos/StashApp

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
